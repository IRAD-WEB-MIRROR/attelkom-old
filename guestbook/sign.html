<FONT FACE="Arial,Helvetica" SIZE="5" COLOR="#006633"><B>Sign our Guestbook!</B></FONT><BR>
<FONT FACE="Arial,Helvetica" SIZE="2">Thank you for visiting Attelkom Online. Please leave a comment!<BR>
Fields marked with * are required. No HTML please.</FONT>
<P>
<FORM NAME="gb" METHOD="POST" ACTION="/cgi-bin/guestbook.pl" onSubmit="return gbSubmit()">
<TABLE BORDER="1" CELLPADDING="4" CELLSPACING="0" BGCOLOR="#FFFFCC" WIDTH="460">
<TR><TD><FONT FACE="Arial" SIZE="2"><B>Your Name: *</B></FONT></TD><TD><INPUT TYPE="text" NAME="realname" SIZE="30" MAXLENGTH="60"></TD></TR>
<TR><TD><FONT FACE="Arial" SIZE="2"><B>E-mail:</B></FONT></TD><TD><INPUT TYPE="text" NAME="username" SIZE="30" MAXLENGTH="60"></TD></TR>
<TR><TD><FONT FACE="Arial" SIZE="2"><B>Your Homepage:</B></FONT></TD><TD><INPUT TYPE="text" NAME="url" SIZE="30" VALUE="http://"></TD></TR>
<TR><TD><FONT FACE="Arial" SIZE="2"><B>City:</B></FONT></TD><TD><INPUT TYPE="text" NAME="city" SIZE="20"> <SELECT NAME="country"><OPTION>Irad<OPTION>Kyrgyzstan<OPTION>Kazakhstan<OPTION>Uzbekistan<OPTION>Russia<OPTION>USA<OPTION>Germany<OPTION>Other</SELECT></TD></TR>
<TR><TD><FONT FACE="Arial" SIZE="2"><B>How did you find us?</B></FONT></TD><TD><SELECT NAME="found"><OPTION>Attelkom Starter CD<OPTION>Friend<OPTION>UNISearch<OPTION>Yahoo!<OPTION>Alta Vista<OPTION>Newspaper<OPTION>Just surfed in!</SELECT></TD></TR>
<TR><TD COLSPAN="2"><FONT FACE="Arial" SIZE="2"><B>Comments: *</B></FONT><BR><TEXTAREA NAME="comments" COLS="50" ROWS="6" WRAP="virtual"></TEXTAREA></TD></TR>
<TR><TD COLSPAN="2" ALIGN="center"><INPUT TYPE="submit" VALUE="Sign Guestbook"> <INPUT TYPE="reset" VALUE="Clear Form"></TD></TR>
</TABLE>
</FORM>
<P>
